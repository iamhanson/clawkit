name: Release Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build distribution assets
        env:
          CLAWKIT_GITHUB_REPO: ${{ github.repository }}
          CLAWKIT_GITHUB_TAG: ${{ github.ref_name }}
        run: npm run build:distribution

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/distribution/core.zip
            dist/distribution/manifest.json
            dist/distribution/kits/*.zip
          overwrite_files: true
